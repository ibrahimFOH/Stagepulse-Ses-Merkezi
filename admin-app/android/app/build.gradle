plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ciReleaseStorePath = System.getenv('ANDROID_KEYSTORE_PATH')

android {
    namespace 'com.stagepulse.yonetim'
    compileSdk 35

    defaultConfig {
        applicationId 'com.stagepulse.yonetim'
        minSdk 26
        targetSdk 35
        versionCode 30809
        versionName '3.8.9'
    }

    if (ciReleaseStorePath) {
        signingConfigs {
            ciRelease {
                storeFile file(ciReleaseStorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (ciReleaseStorePath) signingConfig signingConfigs.ciRelease
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
