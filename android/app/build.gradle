plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ciReleaseStorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def ciReleaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def ciReleaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def ciReleaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def updateChannel = 'stable'

android {
    namespace 'com.stagepulse.sesmerkezi'
    compileSdk 35

    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.stagepulse.sesmerkezi'
        minSdk 26
        targetSdk 35
        versionCode 30809
        versionName '3.8.9'
        buildConfigField 'String', 'UPDATE_CHANNEL', '"' + updateChannel + '"'
    }

    if (ciReleaseStorePath) {
        if (!ciReleaseStorePassword || !ciReleaseKeyAlias || !ciReleaseKeyPassword) {
            throw new GradleException('Android Release imzalama Secrets eksik.')
        }
        signingConfigs {
            ciRelease {
                storeFile file(ciReleaseStorePath)
                storePassword ciReleaseStorePassword
                keyAlias ciReleaseKeyAlias
                keyPassword ciReleaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (ciReleaseStorePath) {
                signingConfig signingConfigs.ciRelease
            } else if (System.getenv('CI') == 'true') {
                throw new GradleException('CI ortamında imzasız Release APK üretilemez.')
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core-ktx:1.15.0'
}
