name: Android geçici imza ve APK bütünlük kontrolü

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-device-signing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-release:
    name: Geçici CI anahtarıyla imzalı APK bütünlük testi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Android APK varlıklarını denetle
        run: python android/scripts/verify_assets.py
      - name: JavaScript dosyalarını doğrula
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d "" file; do node --check "$file"; done < <(find android/app/src/main/assets/ui -type f -name "*.js" -print0)
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/35.0.0/zipalign"
      - name: Geçici CI imza anahtarı oluştur
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stagepulse-signing"
          STORE="$RUNNER_TEMP/stagepulse-signing/ci-test-release.jks"
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_ALIAS="stagepulse-ci-test"
          keytool -genkeypair -noprompt -v \
            -keystore "$STORE" -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
            -dname "CN=Stagepulse CI Test, OU=Build Verification, O=Stagepulse, C=TR" \
            -keyalg RSA -keysize 3072 -validity 30
          {
            echo "ANDROID_KEYSTORE_PATH=$STORE"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$STORE_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Android birim testlerini ve imzalı Release APK derlemesini çalıştır
        run: gradle -p android --no-daemon testDebugUnitTest assembleRelease --stacktrace
      - name: İmza ve APK bütünlüğünü doğrula
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$ZIPALIGN" -c -v 4 "$APK"
          sha256sum "$APK"
      - name: İmzalı CI test APK artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: Stagepulse-Ses-Merkezi-Android-SIGNED-CI-TEST
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
