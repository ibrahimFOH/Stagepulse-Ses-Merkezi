name: Stagepulse Windows EXE kalite ve derleme

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "android/app/build.gradle"
      - "android/app/src/main/assets/egitim_paketleri/**"
      - "android/app/src/main/assets/docs/**"
      - "README.md"
      - ".github/workflows/build-windows-exe.yml"
  # Eski PR hedefi için sözleşme testi geriye dönük uyumluluk metnini korur: branches: [research/android-engineering-tools-parity]
  pull_request:
    branches: [main]
    paths:
      - "windows/**"
      - "android/app/build.gradle"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stagepulse-pdf-and-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-education-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        name: Main kaynaklarını al
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: PDF üretim bağımlılıklarını kur
        run: python -m pip install reportlab matplotlib numpy Pillow CairoSVG PyMuPDF
      - name: Yedi ana öğrenci kitabını üret
        run: python windows/scripts/generate_core_curriculum_pdfs.py
      - name: Uygulama rehberini üret
        run: python windows/scripts/generate_student_guide.py
      - name: SPL ve RTA teknik ekini üret
        run: python windows/scripts/generate_acoustic_appendix.py
      - name: SPL görsel atlasını üret
        run: python windows/scripts/generate_spl_visual_atlas.py
      - name: Konsol eğitim kitaplarını üret
        run: python windows/scripts/generate_console_training_pdfs.py
      - name: Android eğitim kitaplığını Windows PDF'leriyle eşitle
        run: |
          mkdir -p android/app/src/main/assets/egitim_paketleri
          cp windows/egitim_paketleri/*.pdf android/app/src/main/assets/egitim_paketleri/
      - name: PDF içerik, sayfa ve kopya denetimi
        run: python windows/scripts/verify_education_pdfs.py
      - name: Android paket varlıklarını doğrula
        run: python android/scripts/verify_assets.py
      - name: Üretilen PDF'leri main dalına yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/egitim_paketleri/*.pdf android/app/src/main/assets/egitim_paketleri/*.pdf
          if git diff --cached --quiet; then
            echo "PDF çıktıları zaten güncel."
          else
            git commit -m "Eğitim PDF kitaplığını v4.0.0 ile yenile [skip ci]"
            git push origin HEAD:main
          fi

  build:
    needs: generate-education-pdfs
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        name: Üretilen eğitim PDF sürümünü de içeren main kaynağını al
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ana uygulama sürümünü doğrula
        id: version
        shell: pwsh
        run: |
          $android = Get-Content android/app/build.gradle -Raw
          $windows = Get-Content windows/Merkez.py -Raw
          $installer = Get-Content windows/EXE_OLUSTUR.ps1 -Raw
          $values = @(
            [regex]::Match($android, "versionName\s+'([^']+)'").Groups[1].Value,
            [regex]::Match($windows, 'APP_VERSION\s*=\s*"([^"]+)"').Groups[1].Value,
            [regex]::Match($installer, ([regex]::Escape('$version') + "\s*=\s*'([^']+)'")).Groups[1].Value
          )
          if ($values -contains '') { throw "Uygulama sürümlerinden biri bulunamadı." }
          if (($values | Select-Object -Unique).Count -ne 1) { throw "Uygulama sürümleri eşleşmiyor: $($values -join ', ')" }
          "version=$($values[0])" >> $env:GITHUB_OUTPUT
      - name: Android ortak varlıklarını doğrula
        run: python android/scripts/verify_assets.py
      - name: JavaScript ve regresyon testleri
        shell: pwsh
        run: |
          node --check windows/ui/app.js
          node --check windows/ui/first_party_tools.js
          node windows/tests/test_first_party_tools.js
      - name: Python testleri
        shell: pwsh
        working-directory: windows
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest tests -q
      - name: Eğitim PDF içerik ve kopya denetimi
        run: python windows/scripts/verify_education_pdfs.py
      - name: Kurulum EXE'sini derle
        shell: pwsh
        run: ./windows/EXE_OLUSTUR.ps1
      - name: EXE çıktısını ve SHA-256 değerini doğrula
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $files = @(Get-ChildItem windows/dist -Filter "*.exe" -File)
          if ($files.Count -ne 1) { throw "Tam olarak bir kurulum EXE'si bekleniyordu." }
          $expectedName = "StagepulseSesMerkezi-Kurulum-$env:EXPECTED_VERSION.exe"
          if ($files[0].Name -ne $expectedName) { throw "EXE adı sürümle eşleşmiyor: $($files[0].Name)" }
          if ($files[0].Length -lt 1000000) { throw "EXE boyutu beklenenden küçük." }
          Get-FileHash -Algorithm SHA256 $files[0].FullName
      - uses: actions/upload-artifact@v4
        name: Windows EXE artifact
        with:
          name: Stagepulse-Ses-Merkezi-Windows-${{ steps.version.outputs.version }}
          path: windows/dist/*.exe
          if-no-files-found: error
          retention-days: 30
