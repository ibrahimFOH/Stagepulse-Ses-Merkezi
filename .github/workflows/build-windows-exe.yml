name: Stagepulse Windows EXE kalite ve derleme

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "android/app/build.gradle"
      - "android/app/src/main/assets/egitim_paketleri/**"
      - "android/app/src/main/assets/docs/**"
      - "README.md"
      - ".github/workflows/build-windows-exe.yml"
  # Eski PR hedefi için sözleşme testi geriye dönük uyumluluk metnini korur: branches: [research/android-engineering-tools-parity]
  pull_request:
    branches: [main]
    paths:
      - "windows/**"
      - "android/app/build.gradle"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stagepulse-pdf-and-build-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-education-pdfs:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: PR veya main kaynaklarını al
        with:
          ref: ${{ github.event.pull_request.head.ref || 'main' }}
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: uv sürümünü sabitle
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          enable-cache: true
      - name: PDF bağımlılık hash kilidini üret veya güncelle
        run: uv pip compile --generate-hashes --python-version 3.11 --output-file windows/requirements-pdf.lock windows/requirements-pdf.in
      - name: PDF üretim bağımlılıklarını hash doğrulamasıyla kur
        run: python -m pip install --require-hashes -r windows/requirements-pdf.lock
      - name: Yedi ana öğrenci kitabını üret
        run: python windows/scripts/generate_core_curriculum_pdfs.py
      - name: Uygulama rehberini üret
        run: python windows/scripts/generate_student_guide.py
      - name: SPL ve RTA teknik ekini üret
        run: python windows/scripts/generate_acoustic_appendix.py
      - name: SPL görsel atlasını üret
        run: python windows/scripts/generate_spl_visual_atlas.py
      - name: Konsol eğitim kitaplarını üret
        run: python windows/scripts/generate_console_training_pdfs.py
      - name: Tüm öğrenci PDF'lerine ortak iki dilli teknik sözlük ekle
        run: python windows/scripts/append_bilingual_glossary.py
      - name: Android eğitim kitaplığını Windows PDF'leriyle eşitle
        run: |
          mkdir -p android/app/src/main/assets/egitim_paketleri
          cp windows/egitim_paketleri/*.pdf android/app/src/main/assets/egitim_paketleri/
      - name: PDF içerik, sayfa ve kopya denetimi
        run: python windows/scripts/verify_education_pdfs.py
      - name: Android paket varlıklarını doğrula
        run: python android/scripts/verify_assets.py
      - name: Üretilen PDF'leri main dalına yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/requirements-pdf.lock windows/egitim_paketleri/*.pdf android/app/src/main/assets/egitim_paketleri/*.pdf
          if git diff --cached --quiet; then
            echo "PDF çıktıları zaten güncel."
          else
            git commit -m "Eğitim PDF kitaplığını iki dilli terminolojiyle yenile"
            target_branch="${{ github.event.pull_request.head.ref || 'main' }}"
            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch origin "$target_branch"
              git rebase "origin/$target_branch"
              if git push origin "HEAD:$target_branch"; then
                pushed=true
                break
              fi
              echo "$target_branch push yarışı; tekrar denenecek ($attempt/5)"
              sleep 2
            done
            if [ "$pushed" != true ]; then
              echo "PDF commit'i hedef dala yazılamadı."
              exit 1
            fi
          fi

  build:
    needs: generate-education-pdfs
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Üretilen PDF'leri içeren PR/main kaynağını al
        with:
          ref: ${{ github.event.pull_request.head.ref || 'main' }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          architecture: x64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Ana uygulama sürümünü doğrula
        id: version
        shell: pwsh
        run: |
          $android = Get-Content android/app/build.gradle -Raw
          $windows = Get-Content windows/Merkez.py -Raw
          $installer = Get-Content windows/EXE_OLUSTUR.ps1 -Raw
          $values = @(
            [regex]::Match($android, "versionName\s+'([^']+)'").Groups[1].Value,
            [regex]::Match($windows, 'APP_VERSION\s*=\s*"([^"]+)"').Groups[1].Value,
            [regex]::Match($installer, ([regex]::Escape('$version') + "\s*=\s*'([^']+)'")).Groups[1].Value
          )
          if ($values -contains '') { throw "Uygulama sürümlerinden biri bulunamadı." }
          if (($values | Select-Object -Unique).Count -ne 1) { throw "Uygulama sürümleri eşleşmiyor: $($values -join ', ')" }
          "version=$($values[0])" >> $env:GITHUB_OUTPUT
      - name: Android ortak varlıklarını doğrula
        run: python android/scripts/verify_assets.py
      - name: JavaScript ve regresyon testleri
        shell: pwsh
        run: |
          node --check windows/ui/bilingual_terms.js
          node --check windows/ui/app.js
          node --check windows/ui/first_party_tools.js
          node windows/tests/test_first_party_tools.js
      - name: Python testleri
        shell: pwsh
        working-directory: windows
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest tests -q
      - name: Kurulum EXE'sini derle
        shell: pwsh
        env:
          STAGEPULSE_KEEP_PAYLOAD: '1'
          STAGEPULSE_SKIP_PREBUILD_TESTS: '1'
        run: ./windows/EXE_OLUSTUR.ps1
      - name: EXE çıktısını ve SHA-256 değerini doğrula
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $files = @(Get-ChildItem windows/dist -Filter "*.exe" -File)
          if ($files.Count -ne 1) { throw "Tam olarak bir kurulum EXE'si bekleniyordu." }
          $expectedName = "StagepulseSesMerkezi-Kurulum-$env:EXPECTED_VERSION.exe"
          if ($files[0].Name -ne $expectedName) { throw "EXE adı sürümle eşleşmiyor: $($files[0].Name)" }
          if ($files[0].Length -lt 1000000) { throw "EXE boyutu beklenenden küçük." }
          Get-FileHash -Algorithm SHA256 $files[0].FullName
      - name: CI için geçici MSIX test sertifikası oluştur
        shell: pwsh
        run: |
          $password = ([guid]::NewGuid().ToString('N') + 'Aa9!')
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=Stagepulse' -FriendlyName 'Stagepulse CI MSIX Test' -CertStoreLocation 'Cert:\CurrentUser\My' -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256 -KeyExportPolicy Exportable -KeyUsage DigitalSignature -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}') -NotAfter (Get-Date).AddDays(7)
          $pfx = Join-Path $env:RUNNER_TEMP 'Stagepulse-CI-MSIX.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString -String $password -AsPlainText -Force) | Out-Null
          Export-Certificate -Cert $cert -FilePath (Join-Path $env:RUNNER_TEMP 'Stagepulse-CI-MSIX.cer') -Type CERT | Out-Null
          $testCer = Join-Path $env:RUNNER_TEMP 'Stagepulse-CI-MSIX.cer'
          Import-Certificate -FilePath $testCer -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          "MSIX_TEST_PFX=$pfx" >> $env:GITHUB_ENV
          "MSIX_TEST_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: MSIX paketini oluştur, imzala ve doğrula
        shell: pwsh
        run: |
          $payload = Join-Path $env:GITHUB_WORKSPACE 'windows\build\payload\StagepulseSesMerkezi'
          $output = Join-Path $env:GITHUB_WORKSPACE 'windows\dist'
          & ./windows/MSIX_OLUSTUR.ps1 -PayloadPath $payload -OutputDirectory $output -CertificatePath $env:MSIX_TEST_PFX -CertificatePassword $env:MSIX_TEST_PASSWORD
          if ($LASTEXITCODE -ne 0) { throw "MSIX derlemesi başarısız: $LASTEXITCODE" }
          # MSIX betiği çalışma dizinini değiştirebilir; tüm kontroller mutlak çıktı yolunu kullanır.
          $msix = @(Get-ChildItem -LiteralPath $output -Filter '*.msix' -File)
          if ($msix.Count -ne 1 -or $msix[0].Length -lt 1000000) { throw 'Tek ve geçerli boyutta bir MSIX paketi bekleniyordu.' }
          if (-not (Test-Path -LiteralPath ($msix[0].FullName + '.sha256'))) { throw 'MSIX SHA-256 dosyası eksik.' }
          if (-not (Test-Path -LiteralPath (Join-Path $output 'Stagepulse-MSIX-Signing.cer'))) { throw 'MSIX test sertifikası eksik.' }
          Write-Host "MSIX CI doğrulaması başarılı: $($msix[0].Name)" -ForegroundColor Green

      - name: MSIX paketini Windows'a kurup kaldırarak doğrula
        shell: powershell
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'windows\dist'
          $msix = @(Get-ChildItem -LiteralPath $output -Filter '*.msix' -File)
          if ($msix.Count -ne 1) { throw 'Tek bir MSIX paketi bekleniyordu.' }
          Add-AppxPackage -Path $msix[0].FullName -ErrorAction Stop
          $installed = Get-AppxPackage -Name 'Stagepulse.SesMerkezi'
          if (-not $installed) { throw 'Add-AppxPackage başarılı göründü ancak paket kaydı bulunamadı.' }
          Remove-AppxPackage -Package $installed.PackageFullName -ErrorAction Stop
          Write-Host "MSIX_INSTALL_REMOVE_OK $($msix[0].Name)" -ForegroundColor Green

      - name: Microsoft Store için kimliği eşleşen imzasız MSIX oluştur ve doğrula
        shell: pwsh
        run: |
          $payload = Join-Path $env:GITHUB_WORKSPACE 'windows\build\payload\StagepulseSesMerkezi'
          $output = Join-Path $env:GITHUB_WORKSPACE 'windows\dist'
          & ./windows/MSIX_OLUSTUR.ps1 -PayloadPath $payload -OutputDirectory $output -StoreSubmission
          if ($LASTEXITCODE -ne 0) { throw "Store MSIX derlemesi başarısız: $LASTEXITCODE" }
          $packages = @(Get-ChildItem -LiteralPath $output -Filter 'Stagepulse-Ses-Merkezi-Store-*.msix' -File)
          if ($packages.Count -ne 1) { throw 'Tek bir Microsoft Store MSIX paketi bekleniyordu.' }
          if (-not (Test-Path -LiteralPath ($packages[0].FullName + '.sha256'))) { throw 'Store MSIX SHA-256 dosyası eksik.' }
          $sdkBin = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Windows Kits\10\bin'
          $makeAppx = Get-ChildItem -Path $sdkBin -Filter MakeAppx.exe -Recurse | Where-Object { $_.FullName -match '\\x64\\MakeAppx\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeAppx) { throw 'MakeAppx.exe bulunamadı.' }
          $unpack = Join-Path $env:RUNNER_TEMP 'stagepulse-store-msix-check'
          & $makeAppx.FullName unpack /o /p $packages[0].FullName /d $unpack
          if ($LASTEXITCODE -ne 0) { throw 'Store MSIX paketi açılamadı.' }
          [xml]$manifest = Get-Content -LiteralPath (Join-Path $unpack 'AppxManifest.xml') -Raw
          $identity = $manifest.Package.Identity
          if ($identity.Name -cne 'stagepulse.stagepulsesesmerkezi') { throw "Store Identity Name eşleşmiyor: $($identity.Name)" }
          if ($identity.Publisher -cne 'CN=8CD6B337-E6A4-4EAB-B0B3-AA17F70913DD') { throw "Store Publisher eşleşmiyor: $($identity.Publisher)" }
          if ($manifest.Package.Properties.PublisherDisplayName -cne 'stagepulse') { throw 'PublisherDisplayName eşleşmiyor.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $packages[0].FullName
          if ($signature.Status -ne 'NotSigned') { throw "Store'a gönderilecek paket imzasız olmalı; mevcut durum: $($signature.Status)" }
          Write-Host "STORE_MSIX_IDENTITY_OK $($packages[0].Name)" -ForegroundColor Green

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        name: Windows EXE ve MSIX artifact
        with:
          name: Stagepulse-Ses-Merkezi-Windows-${{ steps.version.outputs.version }}
          path: windows/dist/*
          if-no-files-found: error
          retention-days: 30
