name: Stagepulse Yönetim Paneli EXE + APK

on:
  push:
    branches: [main]
    paths:
      - "admin-app/**"
      - ".github/workflows/build-admin-apps.yml"
  pull_request:
    branches: [main]
    paths:
      - "admin-app/**"
      - ".github/workflows/build-admin-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        name: Kaynak kodunu al
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Yönetim sürümünü doğrula
        id: version
        shell: pwsh
        run: |
          $source = Get-Content admin-app/desktop/main.py -Raw
          if ($source -notmatch 'APP_VERSION\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"') { throw "Yönetim EXE sürümü bulunamadı." }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - name: Bağımlılıkları kur
        run: python -m pip install -r admin-app/desktop/requirements.txt
      - name: JavaScript sözdizimini denetle
        run: node --check assets\app.js
        working-directory: admin-app/desktop
      - name: Yönetim EXE'sini derle
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Stagepulse-Yonetim-Paneli-${{ steps.version.outputs.version }} --add-data "admin-app\desktop\assets;assets" admin-app/desktop/main.py
      - name: EXE çıktısını doğrula
        shell: pwsh
        run: |
          $exe = "dist/Stagepulse-Yonetim-Paneli-${{ steps.version.outputs.version }}.exe"
          if (!(Test-Path $exe) -or (Get-Item $exe).Length -lt 1000000) { throw "Yönetim EXE çıktısı eksik veya geçersiz." }
          Get-FileHash -Algorithm SHA256 $exe
      - uses: actions/upload-artifact@v4
        name: Windows yönetim EXE artifact
        with:
          name: Stagepulse-Yonetim-Paneli-Windows-${{ steps.version.outputs.version }}
          path: dist/Stagepulse-Yonetim-Paneli-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 30

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        name: Kaynak kodunu al
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Yönetim JavaScript sözdizimini denetle
        run: node --check app.js
        working-directory: admin-app/android/app/src/main/assets
      - name: Yönetim sürümünü doğrula
        id: version
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          s=Path("admin-app/android/app/build.gradle").read_text()
          n=re.search(r"versionName\s+'([^']+)'",s)
          c=re.search(r"versionCode\s+(\d+)",s)
          if not n or not c: raise SystemExit("Yönetim APK sürümü eksik.")
          m=re.fullmatch(r"(\d+)\.(\d+)\.(\d+)",n.group(1))
          if not m: raise SystemExit("Sürüm biçimi hatalı.")
          expected=int(m[1])*10000+int(m[2])*100+int(m[3])
          if int(c[1])!=expected: raise SystemExit(f"versionCode uyuşmuyor: {c[1]} != {expected}")
          print("version="+n[1])
          PY
      - name: Yönetim APK derle
        run: gradle -p admin-app/android --no-daemon clean assembleDebug
      - name: APK paket kimliği ve sürümünü doğrula
        shell: bash
        run: |
          set -euo pipefail
          APK=admin-app/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.stagepulse.yonetim' versionCode='30809' versionName='3.8.9'"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        name: Android yönetim APK artifact
        with:
          name: Stagepulse-Yonetim-Paneli-Android-${{ steps.version.outputs.version }}
          path: admin-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
