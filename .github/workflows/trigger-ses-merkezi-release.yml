name: Stagepulse Ses Merkezi ana dal kararlı yayın tetikleyicisi

on:
  # Kararlı yayın yalnızca main'e alınan uygulama kaynak değişikliklerinde başlar.
  # PR/research derlemeleri hiçbir zaman stable kanalına gönderilmez.
  push:
    branches: [main]
    paths:
      - "android/**"
      - "windows/**"
      - "README.md"
      - "!android/**/*.md"
      - "!windows/**/*.md"
      - "!android/**/README*"
      - "!windows/**/README*"
      - "!android/app/src/test/**"
      - "!android/app/src/androidTest/**"
      - "!windows/docs/**"
      - "!windows/tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ses-merkezi-auto-release
  cancel-in-progress: false

jobs:
  trigger-release:
    name: Kaynak sürümünü doğrula ve yayın deposunu otomatik tetikle
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ana dal kaynak kodunu al
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Yayın deposu erişim anahtarını doğrula
        shell: bash
        env:
          RELEASE_REPO_DISPATCH_TOKEN: ${{ secrets.RELEASE_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_REPO_DISPATCH_TOKEN:-}" ]]; then
            echo "::error::RELEASE_REPO_DISPATCH_TOKEN eksik. Stagepulse-Releases deposuna repository_dispatch yetkili fine-grained token eklenmeli."
            exit 1
          fi

      - name: Platform sürümlerini doğrula ve sabit commit SHA üzerinden yayın başlat
        shell: bash
        env:
          RELEASE_REPO_DISPATCH_TOKEN: ${{ secrets.RELEASE_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path

          files = {
              "Android": ("android/app/build.gradle", r"versionName\s+'([^']+)'"),
              "Windows": ("windows/Merkez.py", r'APP_VERSION\s*=\s*"([^"]+)"'),
              "Windows kurucu": ("windows/EXE_OLUSTUR.ps1", r"\$version\s*=\s*'([^']+)'"),
              "NSIS": ("windows/setup/StagepulseSesMerkezi.nsi", r'!define\s+VERSION\s+"([^"]+)"'),
          }
          values = {}
          for label, (filename, pattern) in files.items():
              match = re.search(pattern, Path(filename).read_text(encoding="utf-8"))
              if not match:
                  raise SystemExit(f"{label} sürüm alanı bulunamadı.")
              values[label] = match.group(1)

          if len(set(values.values())) != 1:
              raise SystemExit("Windows/Android sürümleri eşleşmiyor: " + repr(values))

          version = next(iter(values.values()))
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
          if not match:
              raise SystemExit("Sürüm X.Y.Z biçiminde olmalı: " + version)

          expected_code = int(match.group(1)) * 10000 + int(match.group(2)) * 100 + int(match.group(3))
          gradle = Path("android/app/build.gradle").read_text(encoding="utf-8")
          code = re.search(r"versionCode\s+(\d+)", gradle)
          if not code or int(code.group(1)) != expected_code:
              raise SystemExit(f"Android versionCode hatalı: beklenen {expected_code}")

          print(version)
          PY
          )"

          SOURCE_REF="$GITHUB_SHA"
          echo "Kaynak sürüm doğrulandı: $RELEASE_VERSION"
          echo "Yayın için sabit commit: $SOURCE_REF"

          PAYLOAD="$(python3 - "$RELEASE_VERSION" "$SOURCE_REF" <<'PY'
          import json, sys
          print(json.dumps({
              "event_type": "ses-merkezi-release",
              "client_payload": {
                  "release_version": sys.argv[1],
                  "source_ref": sys.argv[2]
              }
          }))
          PY
          )"

          HTTP_STATUS="$(curl --silent --show-error --output "$RUNNER_TEMP/dispatch-response.json" --write-out '%{http_code}' \
            --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 90 \
            --request POST \
            --url "https://api.github.com/repos/ibrahimFOH/Stagepulse-Releases/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $RELEASE_REPO_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD")"

          if [[ "$HTTP_STATUS" != "204" ]]; then
            echo "::error::Yayın deposu tetiklenemedi. GitHub HTTP: $HTTP_STATUS"
            cat "$RUNNER_TEMP/dispatch-response.json"
            exit 1
          fi

          echo "STABLE_RELEASE_TRIGGERED $SOURCE_REF"
