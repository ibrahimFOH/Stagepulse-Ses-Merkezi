name: Stagepulse Ses Merkezi 3.8.9 kararlı yayın tetikleyicisi

on:
  push:
    branches: [main]
    paths:
      - "android/app/build.gradle"
      - "windows/Merkez.py"
      - "windows/EXE_OLUSTUR.ps1"
      - "windows/setup/StagepulseSesMerkezi.nsi"
      - "admin-app/android/app/build.gradle"
      - "admin-app/desktop/main.py"
      - ".github/workflows/trigger-ses-merkezi-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ses-merkezi-auto-release
  cancel-in-progress: false

jobs:
  trigger-release:
    name: Beş sürüm alanını doğrula ve yayın deposunu tetikle
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        name: Ana dal kaynak kodunu al
        with:
          ref: main
          fetch-depth: 0
      - name: Tüm uygulama sürümlerini doğrula ve yayın etiketini oluştur
        shell: bash
        env:
          RELEASE_REPO_DISPATCH_TOKEN: ${{ secrets.RELEASE_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_REPO_DISPATCH_TOKEN:-}" ]]; then
            echo "::error::RELEASE_REPO_DISPATCH_TOKEN deposu sırrı tanımlı değil."
            exit 1
          fi
          RELEASE_VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path
          files = {
              "ana Android": ("android/app/build.gradle", r"versionName\s+'([^']+)'"),
              "ana Windows": ("windows/Merkez.py", r'APP_VERSION\s*=\s*"([^"]+)"'),
              "Windows kurucu": ("windows/EXE_OLUSTUR.ps1", r"\$version\s*=\s*'([^']+)'"),
              "yönetim Android": ("admin-app/android/app/build.gradle", r"versionName\s+'([^']+)'"),
              "yönetim Windows": ("admin-app/desktop/main.py", r'APP_VERSION\s*=\s*"([^"]+)"'),
          }
          values = {}
          for label, (filename, pattern) in files.items():
              match = re.search(pattern, Path(filename).read_text(encoding="utf-8"))
              if not match:
                  raise SystemExit(f"{label} sürüm alanı bulunamadı.")
              values[label] = match.group(1)
          unique = set(values.values())
          if unique != {"3.8.9"}:
              raise SystemExit("Bütün uygulamalar 3.8.9 olmalı: " + repr(values))
          gradle = Path("android/app/build.gradle").read_text(encoding="utf-8")
          code = re.search(r"versionCode\s+(\d+)", gradle)
          if not code or int(code.group(1)) != 30809:
              raise SystemExit("Ana Android versionCode 30809 değil.")
          admin = Path("admin-app/android/app/build.gradle").read_text(encoding="utf-8")
          admin_code = re.search(r"versionCode\s+(\d+)", admin)
          if not admin_code or int(admin_code.group(1)) != 30809:
              raise SystemExit("Yönetim Android versionCode 30809 değil.")
          print("3.8.9")
          PY
          )"
          TAG="ses-merkezi-v$RELEASE_VERSION"
          EXISTING_SHA="$(git ls-remote --refs origin "refs/tags/$TAG" | awk 'NR==1 {print $1}')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$GITHUB_SHA"
          if [[ -z "$EXISTING_SHA" ]]; then
            git push origin "refs/tags/$TAG"
          elif [[ "$EXISTING_SHA" != "$GITHUB_SHA" ]]; then
            git push --force origin "refs/tags/$TAG"
          fi
          PAYLOAD="$(python3 - "$RELEASE_VERSION" "refs/tags/$TAG" <<'PY'
          import json, sys
          print(json.dumps({"event_type":"ses-merkezi-release","client_payload":{"release_version":sys.argv[1],"source_ref":sys.argv[2]}}))
          PY
          )"
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 90 \
            --request POST \
            --url "https://api.github.com/repos/ibrahimFOH/Stagepulse-Releases/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $RELEASE_REPO_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD"
          echo "STABLE_RELEASE_TRIGGERED $TAG"
