name: Stagepulse Ses Merkezi otomatik kararlı yayın

on:
  push:
    branches:
      - feature/wavelab-live-mic-delay
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ses-merkezi-auto-release
  cancel-in-progress: false

jobs:
  trigger-release:
    name: Kaynak sürümünü doğrula ve kararlı yayını otomatik başlat
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Kaynak kodunu ve etiketleri al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sürüm numarasını doğrula, benzersiz etiket oluştur ve yayını tetikle
        shell: bash
        env:
          RELEASE_REPO_DISPATCH_TOKEN: ${{ secrets.RELEASE_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${RELEASE_REPO_DISPATCH_TOKEN:-}" ]]; then
            echo "::error::RELEASE_REPO_DISPATCH_TOKEN deposu sırrı tanımlı değil."
            exit 1
          fi

          RELEASE_VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path

          gradle = Path("android/app/build.gradle").read_text(encoding="utf-8")
          windows = Path("windows/Merkez.py").read_text(encoding="utf-8")
          installer = Path("windows/EXE_OLUSTUR.ps1").read_text(encoding="utf-8")

          android_version = re.search(r"\bversionName\s+'([^']+)'", gradle)
          android_code = re.search(r"\bversionCode\s+(\d+)", gradle)
          windows_version = re.search(r'APP_VERSION\s*=\s*"([^"]+)"', windows)
          installer_version = re.search(r"\$version\s*=\s*'([^']+)'", installer)

          if not all((android_version, android_code, windows_version, installer_version)):
              raise SystemExit("Android, Windows veya kurucu sürüm alanı bulunamadı.")

          versions = {
              android_version.group(1),
              windows_version.group(1),
              installer_version.group(1),
          }
          if len(versions) != 1:
              raise SystemExit("Android, Windows ve kurucu sürümleri eşleşmiyor: " + ", ".join(sorted(versions)))

          version = versions.pop()
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
          if not match:
              raise SystemExit("Sürüm numarası X.Y.Z biçiminde olmalı.")
          expected_code = int(match.group(1)) * 10000 + int(match.group(2)) * 100 + int(match.group(3))
          if int(android_code.group(1)) != expected_code:
              raise SystemExit(f"Android versionCode hatalı: {android_code.group(1)}; beklenen: {expected_code}")
          print(version)
          PY
          )"

          TAG="ses-merkezi-v$RELEASE_VERSION"
          PUBLISHED_AT="$(curl --silent --show-error --output "$RUNNER_TEMP/release.json" --write-out '%{http_code}' "https://api.github.com/repos/ibrahimFOH/Stagepulse-Releases/releases/tags/v$RELEASE_VERSION")"
          if [[ "$PUBLISHED_AT" == "200" ]] && python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if d.get("draft") is False and d.get("published_at") else 1)' "$RUNNER_TEMP/release.json"; then
            echo "Bu sürüm zaten yayımlanmış. Aynı sürüm etiketi yeniden yazılmadı."
            exit 0
          fi

          EXISTING_SHA="$(git ls-remote --refs origin "refs/tags/$TAG" | awk 'NR==1 {print $1}')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$GITHUB_SHA"
          if [[ -z "$EXISTING_SHA" ]]; then
            git push origin "refs/tags/$TAG"
          elif [[ "$EXISTING_SHA" != "$GITHUB_SHA" ]]; then
            git push --force origin "refs/tags/$TAG"
          fi

          PAYLOAD="$(python3 - "$RELEASE_VERSION" "refs/tags/$TAG" <<'PY'
          import json, sys
          print(json.dumps({
              "event_type": "ses-merkezi-release",
              "client_payload": {
                  "release_version": sys.argv[1],
                  "source_ref": sys.argv[2],
              },
          }))
          PY
          )"

          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 90 \
            --request POST \
            --url "https://api.github.com/repos/ibrahimFOH/Stagepulse-Releases/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $RELEASE_REPO_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD"

          echo "Stagepulse Ses Merkezi $RELEASE_VERSION için onaylı yayın derlemesi tetiklendi."
