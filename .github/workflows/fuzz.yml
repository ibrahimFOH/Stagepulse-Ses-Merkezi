name: Stagepulse Python fuzz testleri

on:
  push:
    branches: [main]
    paths:
      - "windows/core/audio_tools.py"
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: stagepulse-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: ClusterFuzzLite WAV parser
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fuzzer derle
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: 5 dakika fuzz testi çalıştır
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: batch
          sanitizer: address
