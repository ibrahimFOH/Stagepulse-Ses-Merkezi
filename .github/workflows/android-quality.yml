name: Android kalite ve imzalı Release APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "windows/ui/first_party_tools.js"
      - ".github/workflows/android-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "windows/ui/first_party_tools.js"
      - ".github/workflows/android-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android testleri ve imzalı Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Android APK kaynak varlıklarını denetle
        run: python android/scripts/verify_assets.py

      - name: Android sürüm bilgisini Gradle dosyasından al
        id: android_version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          gradle = Path("android/app/build.gradle").read_text(encoding="utf-8")
          name = re.search(r"\bversionName\s+'([^']+)'", gradle)
          code = re.search(r"\bversionCode\s+(\d+)", gradle)
          if not name or not code:
              raise SystemExit("Android sürüm bilgisi bulunamadı.")
          m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", name.group(1))
          if not m:
              raise SystemExit("Android sürümü X.Y.Z biçiminde değil.")
          expected = int(m.group(1))*10000 + int(m.group(2))*100 + int(m.group(3))
          if int(code.group(1)) != expected:
              raise SystemExit(f"versionCode uyuşmuyor: {code.group(1)} != {expected}")
          print("version_name=" + name.group(1))
          print("version_code=" + code.group(1))
          PY

      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Android içindeki tüm JavaScript dosyalarını doğrula
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d "" file; do
            test -s "$file"
            node --check "$file"
          done < <(find android/app/src/main/assets/ui -type f -name "*.js" -print0)

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK paketlerini hazırla
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/35.0.0/zipalign"

      - name: Gradle 8.13 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Üretim imza anahtarını hazırla
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Android Release imza Secrets değerlerinden biri eksik."
            exit 1
          fi
          SIGNING_DIR="$RUNNER_TEMP/stagepulse-release-signing"
          mkdir -p "$SIGNING_DIR"
          STORE="$SIGNING_DIR/stagepulse-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          keytool -list -keystore "$STORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          {
            echo "ANDROID_KEYSTORE_PATH=$STORE"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Android birim testlerini ve yalnızca imzalı Release APK derlemesini çalıştır
        run: gradle -p android --no-daemon clean testDebugUnitTest assembleRelease --stacktrace

      - name: Release APK sürümünü, imzasını ve bütünlüğünü doğrula
        shell: bash
        env:
          VERSION_NAME: ${{ steps.android_version.outputs.version_name }}
          VERSION_CODE: ${{ steps.android_version.outputs.version_code }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          grep -Fq "package: name='com.stagepulse.sesmerkezi' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<< "$BADGING"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          sha256sum "$APK"

      - name: İmzalı Release APK artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: Stagepulse-Ses-Merkezi-Android-${{ steps.android_version.outputs.version_name }}-RELEASE
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
