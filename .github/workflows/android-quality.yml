name: Android kalite ve test APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "windows/ui/first_party_tools.js"
      - ".github/workflows/android-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "windows/ui/first_party_tools.js"
      - ".github/workflows/android-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android kaynak, varlık, test ve APK doğrulaması
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Android APK kaynak varlıklarını denetle
        run: python android/scripts/verify_assets.py

      - name: Android sürüm bilgisini Gradle dosyasından al
        id: android_version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          gradle = Path("android/app/build.gradle").read_text(encoding="utf-8")
          name = re.search(r"\bversionName\s+'([^']+)'", gradle)
          code = re.search(r"\bversionCode\s+(\d+)", gradle)
          if not name or not code:
              raise SystemExit("Android sürüm bilgisi bulunamadı.")
          m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", name.group(1))
          if not m:
              raise SystemExit("Android sürümü X.Y.Z biçiminde değil.")
          expected = int(m.group(1))*10000 + int(m.group(2))*100 + int(m.group(3))
          if int(code.group(1)) != expected:
              raise SystemExit(f"versionCode uyuşmuyor: {code.group(1)} != {expected}")
          print("version_name=" + name.group(1))
          print("version_code=" + code.group(1))
          PY

      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Android içindeki tüm JavaScript dosyalarını doğrula
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d "" file; do
            test -s "$file"
            node --check "$file"
          done < <(find android/app/src/main/assets/ui -type f -name "*.js" -print0)

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK paketlerini hazırla
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android birim testlerini ve debug APK derlemesini çalıştır
        run: gradle -p android --no-daemon clean testDebugUnitTest assembleDebug --stacktrace

      - name: Debug APK dosyasını sürüm, paket ve SHA-256 açısından doğrula
        shell: bash
        env:
          VERSION_NAME: ${{ steps.android_version.outputs.version_name }}
          VERSION_CODE: ${{ steps.android_version.outputs.version_code }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          grep -Fq "package: name='com.stagepulse.sesmerkezi' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<< "$BADGING"
          sha256sum "$APK"

      - name: Test APK artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: Stagepulse-Ses-Merkezi-Android-${{ steps.android_version.outputs.version_name }}-TEST-DEBUG
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
