name: Android kalite ve testler

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "windows/ui/first_party_tools.js"
      - ".github/workflows/android-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "windows/ui/first_party_tools.js"
      - ".github/workflows/android-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android kaynak, varlık ve birim testleri
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Python 3.12 kur
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Android kaynak varlıklarını denetle
        run: python android/scripts/verify_assets.py

      - name: Android sürüm bilgisini doğrula
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          gradle = Path("android/app/build.gradle").read_text(encoding="utf-8")
          name = re.search(r"\bversionName\s+'([^']+)'", gradle)
          code = re.search(r"\bversionCode\s+(\d+)", gradle)
          if not name or not code:
              raise SystemExit("Android sürüm bilgisi bulunamadı.")
          m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", name.group(1))
          if not m:
              raise SystemExit("Android sürümü X.Y.Z biçiminde değil.")
          expected = int(m.group(1))*10000 + int(m.group(2))*100 + int(m.group(3))
          if int(code.group(1)) != expected:
              raise SystemExit(f"versionCode uyuşmuyor: {code.group(1)} != {expected}")
          print(f"Android sürümü doğrulandı: {name.group(1)} ({code.group(1)})")
          PY

      - name: Node.js 22 kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Android JavaScript dosyalarını doğrula
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d "" file; do
            test -s "$file"
            node --check "$file"
          done < <(find android/app/src/main/assets/ui -type f -name "*.js" -print0)

      - name: JDK 17 kur
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.13 kur
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: "8.13"

      # Kalite iş akışı APK üretmez veya dağıtmaz.
      # Tek dağıtılabilir APK, release deposunda kalıcı Android anahtarıyla imzalanır.
      - name: Android birim testleri
        run: gradle -p android --no-daemon clean testDebugUnitTest --stacktrace
